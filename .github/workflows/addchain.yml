name: Add Chain to Hadith

on:
  workflow_dispatch:   # bisa dijalankan manual dari GitHub
  push:
    paths:
      - "editions/**"

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Run addchain
        run: |
          cd editions
          node addchain.js

      - name: Commit changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Add chain to hadith files" || echo "Nothing to commit"
          git push

